name: Build and Release MK Story Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version (tag must match vidgen/version.py)
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path vidgen/version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) {
              Write-Error "Tag v$tag does not match APP_VERSION $v in vidgen/version.py"
              exit 1
            }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building MK Story Studio v$v"

      - name: Set up Python 3.14 (becomes the bundled runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Assemble runtime (Python + packages + Playwright Chromium)
        shell: pwsh
        run: |
          $base = Split-Path (Get-Command python).Source -Parent
          New-Item -ItemType Directory -Force payload | Out-Null
          robocopy $base payload\runtime /E /XD __pycache__ /XF *.pyc | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          & payload\runtime\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & payload\runtime\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\payload\runtime\ms-playwright"
          & payload\runtime\python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble app (source + ffmpeg + display fonts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Host "MARKER 1: robocopy app source"
          robocopy . payload\app /E /XD .git .github payload dist logo_samples scripts __pycache__ browser_profiles /XF Mk-Tool.exe Update-App.bat .server_session.json *.pyc my_cloned_voices.json | Out-Null
          $rc = $LASTEXITCODE
          Write-Host "robocopy exit code: $rc"
          if ($rc -ge 8) { throw "robocopy failed with exit code $rc" }
          New-Item -ItemType Directory -Force payload\app\tools\fonts | Out-Null
          Write-Host "MARKER 2: download ffmpeg"
          curl.exe -fL --retry 3 --retry-delay 5 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg download failed, curl exit $LASTEXITCODE" }
          Write-Host ("ffmpeg.zip bytes: " + (Get-Item ffmpeg.zip).Length)
          Write-Host "MARKER 3: extract ffmpeg"
          Expand-Archive ffmpeg.zip -DestinationPath ff_tmp -Force
          $ffmpegExe = Get-ChildItem ff_tmp -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobeExe = Get-ChildItem ff_tmp -Recurse -File -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found in ffmpeg.zip" }
          if (-not $ffprobeExe) { throw "ffprobe.exe not found in ffmpeg.zip" }
          Copy-Item $ffmpegExe.FullName payload\app\tools\
          Copy-Item $ffprobeExe.FullName payload\app\tools\
          Write-Host "MARKER 4: download fonts"
          $fonts = @{
            "LuckiestGuy.ttf" = "https://raw.githubusercontent.com/google/fonts/main/apache/luckiestguy/LuckiestGuy-Regular.ttf"
            "TitanOne.ttf"    = "https://raw.githubusercontent.com/google/fonts/main/ofl/titanone/TitanOne-Regular.ttf"
            "LilitaOne.ttf"   = "https://raw.githubusercontent.com/google/fonts/main/ofl/lilitaone/LilitaOne-Regular.ttf"
            "Bangers.ttf"     = "https://raw.githubusercontent.com/google/fonts/main/ofl/bangers/Bangers-Regular.ttf"
            "Anton.ttf"       = "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf"
          }
          foreach ($k in $fonts.Keys) {
            Write-Host "Downloading font $k"
            curl.exe -fL --retry 3 --retry-delay 5 -o "payload\app\tools\fonts\$k" $fonts[$k]
            if ($LASTEXITCODE -ne 0) { throw "font download failed for $k, curl exit $LASTEXITCODE" }
            $len = (Get-Item "payload\app\tools\fonts\$k").Length
            Write-Host "Font $k bytes: $len"
            if ($len -lt 10000) { throw "font $k is only $len bytes - not a real TTF" }
          }
          Write-Host "MARKER 5: assemble app done"

      - name: Compile launcher (MKStoryStudio.exe)
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /out:payload\MKStoryStudio.exe /win32icon:app.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll launcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item app.ico payload\app.ico

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
          generate_release_notes: true
